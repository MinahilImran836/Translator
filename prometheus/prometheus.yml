global:
  scrape_interval: 15s

scrape_configs:
  - job_name: urdubridge
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: urdubridge-prod
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["https://urdu-banking-translator.onrender.com"]

